name: CI Pipeline Brazweed

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Detectar linguagem
        run: |
          if [ -f "package.json" ]; then
            echo "Detectado Node.js"
            echo "LANGUAGE=node" >> $GITHUB_ENV
          elif [ -f "go.mod" ]; then
            echo "Detectado Go"
            echo "LANGUAGE=go" >> $GITHUB_ENV
          elif [ -f "pom.xml" ]; then
            echo "Detectado Java (Maven)"
            echo "LANGUAGE=java-maven" >> $GITHUB_ENV
          elif [ -f "build.gradle" ]; then
            echo "Detectado Java (Gradle)"
            echo "LANGUAGE=java-gradle" >> $GITHUB_ENV
          elif ls *.csproj 1> /dev/null 2>&1; then
            echo "Detectado .NET"
            echo "LANGUAGE=dotnet" >> $GITHUB_ENV
          else
            echo "Linguagem não detectada. Abortando."
            exit 1
          fi

      - name: Instalar dependências
        run: |
          case "$LANGUAGE" in
            node)
              npm ci
              ;;
            go)
              go mod download
              ;;
            java-maven)
              mvn clean install
              ;;
            java-gradle)
              gradle build
              ;;
            dotnet)
              dotnet restore
              ;;
          esac

